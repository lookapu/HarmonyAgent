[package]
name = "deveco-switch"
version = "0.1.0"
edition = "2021"
description = "DevEco Code Provider Manager"
# 多二进制（deveco-switch 主程序 / full_fetch 数据脚本）时让 cargo run/tauri dev 默认选中主程序
default-run = "deveco-switch"

# 推理加速 feature：
# - embedding：启用本地语义向量（candle 纯 Rust 推理）。默认不启用，让 `cargo test` 不链接
#   candle 依赖（candle 的 gemm/libm 数学函数在 Windows 单元测试链接下触发 0xc0000139）；
#   生产构建（tauri dev/build）通过 tauri.conf.json 的 build.features 带上。
# - cuda：让 candle 编译 CUDA 内核（构建机需装 NVIDIA CUDA 工具链 nvcc），依赖 embedding。
#   运行时仅依赖显卡驱动（cudarc 走 Driver API），无 N 卡/驱动时 embedding 自动回退 CPU。
#   默认不启用：裸 cargo 构建（如无 CUDA 的机器/CI）不会失败；macOS 无法编译 CUDA。
[features]
default = []
embedding = ["dep:candle-core", "dep:candle-transformers", "dep:candle-nn", "dep:tokenizers"]
cuda = ["embedding", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-global-shortcut = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
# 与 reqwest 0.12 内部版本一致（构造 llm-replay 重放响应用）
http = "1"
futures-util = "0.3"
thiserror = "1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
keyring = { version = "3", features = ["windows-native"] }
zip = "2"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
encoding_rs = "0.8"
sha2 = "0.10"
candle-core = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
# default-features = false 关闭 esaxx_fast(esaxx-rs/cpp 的 C++ 实现)与 progressbar，
# 避免引入 C++ 运行时(VCRUNTIME140_1/__CxxFrameHandler4)。保留 onig(纯 C 正则，WordPiece 分词仍可用)。
tokenizers = { version = "0.22", default-features = false, features = ["onig"], optional = true }
candle-nn = { version = "0.11", optional = true }
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# 隐藏控制台（AllocConsole + SW_HIDE）：构建类子进程（hvigor worker 等孙进程）
# 继承隐藏控制台而非新建窗口，解决 GUI 程序调用命令行工具时弹出 cmd 窗口的问题
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

