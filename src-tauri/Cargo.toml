[package]
name = "deveco-switch"
version = "2.1.1"
edition = "2021"
description = "DevEco Code Provider Manager"
# 多二进制（deveco-switch 主程序 / full_fetch 数据脚本）时让 cargo run/tauri dev 默认选中主程序；
# full_fetch 通过 required-features 门控：不启用 full-fetch feature 时 cargo build/tauri build
# 只编译主程序（macOS universal 打包不会因缺失 full_fetch 产物而失败），需手动用时加 --features full-fetch
default-run = "deveco-switch"

# 推理加速 feature：
# - embedding：启用本地语义向量（candle 纯 Rust 推理）。默认不启用，让 `cargo test` 不链接
#   candle 依赖（candle 的 gemm/libm 数学函数在 Windows 单元测试链接下触发 0xc0000139）；
#   生产构建（tauri dev/build）通过 tauri.conf.json 的 build.features 带上。
# - cuda：让 candle 编译 CUDA 内核（构建机需装 NVIDIA CUDA 工具链 nvcc），依赖 embedding。
#   运行时仅依赖显卡驱动（cudarc 走 Driver API），无 N 卡/驱动时 embedding 自动回退 CPU。
#   默认不启用：裸 cargo 构建（如无 CUDA 的机器/CI）不会失败；macOS 无法编译 CUDA。
[features]
default = []
# custom-protocol：Tauri release 构建嵌入前端资源必需。tauri-macros 的 generate_context!
# 以 cfg!(feature="custom-protocol") 判定 dev 模式：未启用时嵌入空资源、运行时加载
# devUrl(http://localhost:5173) → 双击 exe 报 "localhost 拒绝连接"。tauri CLI build 会
# 自动附加该 feature，但裸 cargo build（build-quick.ps1）必须显式带上。
custom-protocol = ["tauri/custom-protocol"]
embedding = ["dep:candle-core", "dep:candle-transformers", "dep:candle-nn", "dep:tokenizers"]
cuda = ["embedding", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
# 数据抓取工具 full_fetch 的独立开关（见 [[bin]] required-features）
full-fetch = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-global-shortcut = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
# 与 reqwest 0.12 内部版本一致（构造 llm-replay 重放响应用）
http = "1"
futures-util = "0.3"
thiserror = "1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
http-body = "1"
http-body-util = "0.1"
bytes = "1"
keyring = { version = "3", features = ["windows-native"] }
zip = "2"
pdf-extract = { version = "0.7", default-features = false }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
encoding_rs = "0.8"
sha2 = "0.10"
ring = "0.17"
regex = "1"
local-ip-address = "0.6"
candle-core = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
# default-features = false 关闭 esaxx_fast(esaxx-rs/cpp 的 C++ 实现)与 progressbar，
# 避免引入 C++ 运行时(VCRUNTIME140_1/__CxxFrameHandler4)。保留 onig(纯 C 正则，WordPiece 分词仍可用)。
tokenizers = { version = "0.22", default-features = false, features = ["onig"], optional = true }
candle-nn = { version = "0.11", optional = true }

[[bin]]
name = "full_fetch"
path = "src/bin/full_fetch.rs"
required-features = ["full-fetch"]
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# 隐藏控制台（AllocConsole + SW_HIDE）：构建类子进程（hvigor worker 等孙进程）
# 继承隐藏控制台而非新建窗口，解决 GUI 程序调用命令行工具时弹出 cmd 窗口的问题
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target."cfg(any(windows, target_os = \"macos\"))".dependencies]
trash = "5.2.6"

# ── release 构建加速 ─────────────────────────────────────────────
# incremental：大 crate（agent 工具链等单 crate 数千行）改动少量代码时只重编受影响文件，
#   日常增量打包显著提速（代价：target 体积增大、产物优化略降）。
# strip：去掉符号表，产物更小、链接更快。
# 全量重建（cargo clean 后）建议用 scripts/build-quick.ps1 -Full（sccache 缓存）。
[profile.release]
incremental = true
strip = true
