name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Override config for macOS (no runtimes/seed on mac, CPU embedding)
        shell: bash
        # --config 深合并无法用空 map 清除 bundle.resources，需直接改写配置文件；
        # macOS 无 nvcc（candle cuda 不可用），features 置空走 CPU 推理
        run: |
          python3 - <<'EOF'
          import json
          p = 'src-tauri/tauri.conf.json'
          d = json.load(open(p, encoding='utf-8'))
          d['bundle']['resources'] = {}
          d['build']['features'] = []
          json.dump(d, open(p, 'w', encoding='utf-8'), indent=2, ensure_ascii=False)
          EOF

      - name: Build Tauri (universal)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # 仓库不再跟踪 runtime/resources（见 .gitignore），CI 产物不捆绑知识库种子/向量模型；
      # features 置空（candle 走 CPU）：无模型资源时 GPU 加速无意义，且免去 choco 装 CUDA 的
      # 不稳定环节（下载易失败/限流），本地完整版构建时才启用 embedding feature
      - name: Override config for Windows CI (bundle runtimes only, no seed/embedding, CPU)
        shell: pwsh
        # --config 深合并无法用空 map 清除 bundle.resources，需直接改写配置文件
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import json; p='src-tauri/tauri.conf.json'; d=json.load(open(p,encoding='utf-8')); d['bundle']['resources']={'runtime/node':'node','runtime/git':'git','runtime/jdk':'jdk'}; d['build']['features']=[]; json.dump(d,open(p,'w',encoding='utf-8'),indent=2,ensure_ascii=False)"
      - name: Prepare bundled runtimes (Node / Git / JDK)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proxy = $env:HTTPS_PROXY
          if (-not $proxy) { $proxy = $env:HTTP_PROXY }
          $proxyArg = if ($proxy) { @{ Proxy = $proxy } } else { @{} }
          New-Item -ItemType Directory -Force -Path src-tauri/runtime | Out-Null

          # 带重试的下载（网络抖动时自动重试 3 次）
          function Get-FileRetry([string]$Uri, [string]$OutFile) {
            $ok = $false
            for ($i = 1; $i -le 3; $i++) {
              try {
                Invoke-WebRequest @proxyArg -Uri $Uri -OutFile $OutFile
                $ok = $true
                break
              } catch {
                Write-Host "Download failed (attempt $i/3): $($_.Exception.Message)"
                Start-Sleep -Seconds 10
              }
            }
            if (-not $ok) { throw "Download failed after 3 attempts: $Uri" }
          }

          # Node 最新 LTS（nodejs.org index.json 自动筛选，解压平铺到 runtime/node）
          $nodeIndex = Invoke-RestMethod @proxyArg -Uri 'https://nodejs.org/dist/index.json'
          $nodeVer = ($nodeIndex | Where-Object { $_.lts } | Select-Object -First 1).version
          Get-FileRetry -Uri "https://nodejs.org/dist/$nodeVer/node-$nodeVer-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node_tmp -Force
          New-Item -ItemType Directory -Force -Path src-tauri/runtime/node | Out-Null
          $nodeRoot = Get-ChildItem node_tmp -Directory | Select-Object -First 1
          Get-ChildItem $nodeRoot.FullName | ForEach-Object { Move-Item $_.FullName src-tauri/runtime/node -Force }
          Remove-Item node.zip, node_tmp -Recurse -Force

          # PortableGit（GitHub 最新 release，SFX 静默解压平铺到 runtime/git）
          $gitTag = (Invoke-RestMethod @proxyArg -Uri 'https://api.github.com/repos/git-for-windows/git/releases/latest').tag_name
          $gitVer = $gitTag.TrimStart('v')
          Get-FileRetry -Uri "https://github.com/git-for-windows/git/releases/download/$gitTag/PortableGit-$gitVer-64-bit.7z.exe" -OutFile git.exe
          New-Item -ItemType Directory -Force -Path git_tmp | Out-Null
          Start-Process -Wait -FilePath "$PWD\git.exe" -ArgumentList '-o', "$PWD\git_tmp", '-y'
          New-Item -ItemType Directory -Force -Path src-tauri/runtime/git | Out-Null
          $gitRoot = Get-ChildItem git_tmp -Directory | Select-Object -First 1
          Get-ChildItem $gitRoot.FullName | ForEach-Object { Move-Item $_.FullName src-tauri/runtime/git -Force }
          Remove-Item git.exe, git_tmp -Recurse -Force

          # Temurin JDK 17（Adoptium 官方 binary API，直接返回 zip，解压为 runtime/jdk）
          Get-FileRetry -Uri 'https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jdk/hotspot/normal/eclipse' -OutFile jdk.zip
          Expand-Archive jdk.zip -DestinationPath jdk_tmp -Force
          $jdkRoot = Get-ChildItem jdk_tmp -Directory | Select-Object -First 1
          Move-Item $jdkRoot.FullName src-tauri/runtime/jdk -Force
          Remove-Item jdk.zip, jdk_tmp -Recurse -Force
          # 瘦身：删除构建不需要的大文件（源码包/jmods/示例/手册/JNI 头），与本地开发机保持一致
          foreach ($d in 'src.zip', 'jmods', 'demo', 'man', 'include') {
            $p = Join-Path 'src-tauri/runtime/jdk' $d
            if (Test-Path $p) { Remove-Item $p -Recurse -Force }
          }

      - name: Override config for Windows CI (bundle runtimes only, no seed/embedding)
        shell: pwsh
        # --config 深合并无法用空 map 清除 bundle.resources，需直接改写配置文件；
        # seed/embedding（知识库种子与向量模型，约 340MB）无公开下载源，CI 产物仅捆绑上方下载的运行时
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import json; p='src-tauri/tauri.conf.json'; d=json.load(open(p,encoding='utf-8')); d['bundle']['resources']={'runtime/node':'node','runtime/git':'git','runtime/jdk':'jdk'}; json.dump(d,open(p,'w',encoding='utf-8'),indent=2,ensure_ascii=False)"

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.zip
            src-tauri/target/release/bundle/msi/*.msi.zip.sig
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/windows

      - name: Generate latest.json for updater
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          MAC_SIG=$(cat artifacts/macos/*.sig 2>/dev/null || echo "")
          WIN_SIG=$(cat artifacts/windows/*.sig 2>/dev/null || echo "")

          cat > artifacts/latest.json << ENDJSON
          {
            "version": "${VERSION}",
            "notes": "Release v${VERSION}",
            "pub_date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MAC_SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/DevEco-Switch.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${MAC_SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/DevEco-Switch.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/DevEco-Switch_${VERSION}_x64-setup.msi.zip"
              }
            }
          }
          ENDJSON

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            artifacts/macos/*
            artifacts/windows/*
            artifacts/latest.json
