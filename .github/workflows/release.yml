name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Override config for macOS (no runtimes/seed on mac, CPU embedding)
        shell: bash
        # --config 深合并无法用空 map 清除 bundle.resources，需直接改写配置文件；
        # macOS 无 nvcc（candle cuda 不可用），features 置空走 CPU 推理
        run: |
          python3 - <<'EOF'
          import json
          p = 'src-tauri/tauri.conf.json'
          d = json.load(open(p, encoding='utf-8'))
          d['bundle']['resources'] = {}
          d['build']['features'] = []
          # 显式生成 updater 签名产物（.app.tar.gz/.dmg.sig）：tauri-utils 2.9 默认不生成（createUpdaterArtifacts=false）
          d['bundle']['createUpdaterArtifacts'] = True
          json.dump(d, open(p, 'w', encoding='utf-8'), indent=2, ensure_ascii=False)
          EOF

      - name: Build Tauri (universal)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg.sig
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # 仓库不再跟踪 runtime/resources（见 .gitignore），CI 产物不捆绑知识库种子/向量模型；
      # features 置空（candle 走 CPU）：无模型资源时 GPU 加速无意义，且免去 choco 装 CUDA 的
      # 不稳定环节（下载易失败/限流），本地完整版构建时才启用 embedding feature
      - name: Override config for Windows CI (bundle runtimes only, no seed/embedding, CPU)
        shell: pwsh
        # --config 深合并无法用空 map 清除 bundle.resources，需直接改写配置文件
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import json; p='src-tauri/tauri.conf.json'; d=json.load(open(p,encoding='utf-8')); d['bundle']['resources']={'runtime/node':'node','runtime/git':'git','runtime/jdk':'jdk'}; d['build']['features']=[]; d['bundle']['createUpdaterArtifacts']=True; json.dump(d,open(p,'w',encoding='utf-8'),indent=2,ensure_ascii=False)"
      - name: Prepare bundled runtimes (Node / Git / JDK)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proxy = $env:HTTPS_PROXY
          if (-not $proxy) { $proxy = $env:HTTP_PROXY }
          $proxyArg = if ($proxy) { @{ Proxy = $proxy } } else { @{} }
          New-Item -ItemType Directory -Force -Path src-tauri/runtime | Out-Null

          # 带重试的下载（网络抖动时自动重试 3 次）
          function Get-FileRetry([string]$Uri, [string]$OutFile) {
            $ok = $false
            for ($i = 1; $i -le 3; $i++) {
              try {
                Invoke-WebRequest @proxyArg -Uri $Uri -OutFile $OutFile
                $ok = $true
                break
              } catch {
                Write-Host "Download failed (attempt $i/3): $($_.Exception.Message)"
                Start-Sleep -Seconds 10
              }
            }
            if (-not $ok) { throw "Download failed after 3 attempts: $Uri" }
          }

          # Node 最新 LTS（nodejs.org index.json 自动筛选，解压平铺到 runtime/node）
          $nodeIndex = Invoke-RestMethod @proxyArg -Uri 'https://nodejs.org/dist/index.json'
          $nodeVer = ($nodeIndex | Where-Object { $_.lts } | Select-Object -First 1).version
          Get-FileRetry -Uri "https://nodejs.org/dist/$nodeVer/node-$nodeVer-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node_tmp -Force
          New-Item -ItemType Directory -Force -Path src-tauri/runtime/node | Out-Null
          $nodeRoot = Get-ChildItem node_tmp -Directory | Select-Object -First 1
          Get-ChildItem $nodeRoot.FullName | ForEach-Object { Move-Item $_.FullName src-tauri/runtime/node -Force }
          Remove-Item node.zip, node_tmp -Recurse -Force

          # PortableGit（GitHub 最新 release，SFX 静默解压平铺到 runtime/git）
          # 注意：asset 名与 tag 名不一致（如 tag v2.55.0.windows.4 → PortableGit-2.55.0.4-64-bit.7z.exe），
          # 从 release assets 列表取官方 URL，避免拼字符串 404
          $gitRel = Invoke-RestMethod @proxyArg -Uri 'https://api.github.com/repos/git-for-windows/git/releases/latest'
          $gitAsset = $gitRel.assets | Where-Object { $_.name -match '^PortableGit-.*-64-bit\.7z\.exe$' } | Select-Object -First 1
          if (-not $gitAsset) { throw 'PortableGit asset not found in latest release' }
          Get-FileRetry -Uri $gitAsset.browser_download_url -OutFile git.exe
          New-Item -ItemType Directory -Force -Path git_tmp | Out-Null
          Start-Process -Wait -FilePath "$PWD\git.exe" -ArgumentList '-o', "$PWD\git_tmp", '-y'
          New-Item -ItemType Directory -Force -Path src-tauri/runtime/git | Out-Null
          $gitRoot = Get-ChildItem git_tmp -Directory | Select-Object -First 1
          Get-ChildItem $gitRoot.FullName | ForEach-Object { Move-Item $_.FullName src-tauri/runtime/git -Force }
          Remove-Item git.exe, git_tmp -Recurse -Force

          # Temurin JDK 17（Adoptium 官方 binary API，直接返回 zip，解压为 runtime/jdk）
          Get-FileRetry -Uri 'https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jdk/hotspot/normal/eclipse' -OutFile jdk.zip
          Expand-Archive jdk.zip -DestinationPath jdk_tmp -Force
          $jdkRoot = Get-ChildItem jdk_tmp -Directory | Select-Object -First 1
          Move-Item $jdkRoot.FullName src-tauri/runtime/jdk -Force
          Remove-Item jdk.zip, jdk_tmp -Recurse -Force
          # 瘦身：删除构建不需要的大文件（源码包/jmods/示例/手册/JNI 头），与本地开发机保持一致
          foreach ($d in 'src.zip', 'jmods', 'demo', 'man', 'include') {
            $p = Join-Path 'src-tauri/runtime/jdk' $d
            if (Test-Path $p) { Remove-Item $p -Recurse -Force }
          }

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/windows

      - name: Generate latest.json for updater
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # download-artifact 保留上传时的目录结构（bundle/dmg、bundle/msi 等嵌套），递归查找真实产物名；
          # Windows msi/exe 是自包含 updater（tauri 不产 .msi.zip，直接对安装器签名），用 nsis exe + exe.sig；
          # macOS 用 .app.tar.gz（universal，darwin 两架构共用）；
          # GitHub 上传资产时会把文件名中的空格替换为点（"DevEco Switch" → "DevEco.Switch"），URL 必须用点，%20 会 404
          MAC_TAR=$(find artifacts/macos -name '*.app.tar.gz' | head -1)
          WIN_EXE=$(find artifacts/windows -name '*.exe' | head -1)
          MAC_SIG=$(find artifacts/macos -name '*.app.tar.gz.sig' | head -1)
          WIN_SIG=$(find artifacts/windows -name '*.exe.sig' | head -1)
          MAC_NAME=$(basename "$MAC_TAR" | sed 's/ /./g')
          WIN_NAME=$(basename "$WIN_EXE" | sed 's/ /./g')
          MAC_SIG_CONTENT=$(cat "$MAC_SIG" 2>/dev/null || echo "")
          WIN_SIG_CONTENT=$(cat "$WIN_SIG" 2>/dev/null || echo "")

          cat > artifacts/latest.json << ENDJSON
          {
            "version": "${VERSION}",
            "notes": "Release v${VERSION}",
            "pub_date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MAC_SIG_CONTENT}",
                "url": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${MAC_NAME}"
              },
              "darwin-x86_64": {
                "signature": "${MAC_SIG_CONTENT}",
                "url": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${MAC_NAME}"
              },
              "windows-x86_64": {
                "signature": "${WIN_SIG_CONTENT}",
                "url": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${WIN_NAME}"
              }
            }
          }
          ENDJSON

      # 重打同 tag 时旧 release 会残留（action-gh-release 遇同名 release 直接失败），
      # 先用 GITHUB_TOKEN 幂等删除旧 release，保证 tag 重打可重入
      - name: Delete existing release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          TAG=${GITHUB_REF#refs/tags/}
          RESP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          REL_ID=$(printf '%s' "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("id","") or "")' 2>/dev/null)
          if [ -n "$REL_ID" ]; then
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$REL_ID" >/dev/null
            echo "Deleted existing release id=$REL_ID"
          else
            echo "No existing release for tag $TAG"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          # download-artifact 保留嵌套目录（bundle/dmg、bundle/msi），用 **/* 递归匹配全部产物
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            artifacts/**/*.msi
            artifacts/**/*.msi.sig
            artifacts/**/*.exe
            artifacts/**/*.exe.sig
            artifacts/**/*.dmg.sig
            artifacts/latest.json
