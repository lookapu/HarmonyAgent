name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Prepare clean-checkout Tauri config
        shell: bash
        run: node -e 'const fs=require("fs");const p="src-tauri/tauri.conf.json";const d=JSON.parse(fs.readFileSync(p,"utf8"));d.bundle.resources={};d.build.features=[];fs.writeFileSync(p,JSON.stringify(d,null,2))'
      - name: Frontend tests
        run: npm test
      # Q-08：文档漂移门禁。数量、路径、接口必须与代码真源一致，
      # 避免 README/ARCHITECTURE 等文档中的数字、链接与实现脱节。
      - name: Documentation drift check (Q-08)
        run: python scripts/check-docs.py
      - name: Frontend lint
        run: npm run lint -- --max-warnings 0
      # Q-04：UI 状态覆盖门禁。每个页面必须头部声明 @ui-states 且声明与代码证据一致，
      # 新增/修改页面未声明或状态覆盖不一致时阻断合并（见 docs/UI_STATE_COVERAGE.md）。
      - name: UI state coverage gate (Q-04)
        run: python scripts/check-ui-states.py
      - name: Frontend production build
        run: npm run build
      - name: Rust tests
        env:
          # Windows 测试线程默认 2MB 栈：compose→run_tool 链在 debug 模式栈帧需求 2~3MB，
          # 默认栈下 STATUS_STACK_OVERFLOW（macOS/Linux 默认 8MB 无此问题）
          RUST_MIN_STACK: 8388608
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Agent reliability gate
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked agent::evals::tests::reliability_gate
      # EC-15：基线回退门禁。restore 命中 main 分支最近一次保存的基线（缺失时不阻断，
      # 本次运行会作为新基线保存）；比较失败时测试退出非零并阻断合并；
      # 只有 main 分支保存新基线，PR 只比较不污染基线。
      - name: Restore evaluation baseline
        id: eval-baseline-restore
        uses: actions/cache/restore@v4
        with:
          path: src-tauri/target/eval-baseline.json
          key: eval-baseline-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            eval-baseline-${{ matrix.os }}-
      - name: Fixed evaluation with CI baseline gate
        env:
          EVAL_BASELINE_IN: src-tauri/target/eval-baseline.json
          EVAL_BASELINE_OUT: src-tauri/target/eval-baseline.json
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked agent::evals::tests::ci_baseline_gate -- --exact --nocapture
      - name: Save evaluation baseline (main only)
        if: github.ref == 'refs/heads/main' && steps.eval-baseline-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src-tauri/target/eval-baseline.json
          key: eval-baseline-${{ matrix.os }}-${{ github.sha }}
      - name: Agent execution kernel V2 gate
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked agent::
      - name: Multi-process worker crash recovery gate
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --test worker_crash_e2e -- --test-threads=1
      - name: Tool worker crash and side-effect recovery gate
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --test tool_worker_crash_e2e -- --test-threads=1
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked
      # Q-07：告警基线门禁。clippy 唯一告警数（按 lint+位置去重）超过基线即阻断；
      # 基线 44 = Q-07 收敛后剩余的结构类告警（too_many_arguments 31 +
      # type_complexity 13），新增任何告警必须修复或显式更新基线。
      - name: Clippy warning baseline gate (Q-07)
        run: python scripts/check-warnings.py --baseline 44
