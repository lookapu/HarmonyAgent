name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Prepare clean-checkout Tauri config
        shell: bash
        run: node -e 'const fs=require("fs");const p="src-tauri/tauri.conf.json";const d=JSON.parse(fs.readFileSync(p,"utf8"));d.bundle.resources={};d.build.features=[];fs.writeFileSync(p,JSON.stringify(d,null,2))'
      - name: Frontend tests
        run: npm test
      - name: Frontend lint
        run: npm run lint
      - name: Frontend production build
        run: npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Agent reliability gate
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked agent::evals::tests::reliability_gate
      - name: Agent execution kernel V2 gate
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked agent::
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked
