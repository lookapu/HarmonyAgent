# ── 本机 CUDA 内核编译环境（candle cuda feature 需要）────────────────────
# nvcc 在 Windows 上需 MSVC host 编译器（cl.exe）+ INCLUDE/LIB。
# 以下路径由 vcvars64.bat 展开值固化：VS 18 Enterprise / MSVC 14.50.35717 / SDK 10.0.26100.0。
# VS 或 SDK 升级后若编译报 "Cannot find compiler 'cl.exe'"，
# 需用 vcvars64.bat 的展开值刷新此处（PATH 追加规则：值不以分隔符结尾则追加到当前 PATH 末尾）。
[env]
NVCC_CCBIN = "C:\\Program Files\\Microsoft Visual Studio\\18\\Enterprise\\VC\\Tools\\MSVC\\14.50.35717\\bin\\Hostx64\\x64\\cl.exe"
PATH = "C:\\Program Files\\Microsoft Visual Studio\\18\\Enterprise\\VC\\Tools\\MSVC\\14.50.35717\\bin\\Hostx64\\x64"
INCLUDE = "C:\\Program Files\\Microsoft Visual Studio\\18\\Enterprise\\VC\\Tools\\MSVC\\14.50.35717\\include;C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.26100.0\\ucrt;C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.26100.0\\um;C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.26100.0\\shared"
LIB = "C:\\Program Files\\Microsoft Visual Studio\\18\\Enterprise\\VC\\Tools\\MSVC\\14.50.35717\\lib\\x64;C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\ucrt\\x64;C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\um\\x64"
